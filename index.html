<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#020d04" />
  <meta name="description" content="Deep Work Timer — fokus-session loggare med retro CRT-estetik" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FOCUS" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />
  <title>FOCUS // Deep Work Terminal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #00ff41;
      --green-mid: #00c032;
      --green-dim: #004d14;
      --green-glow: rgba(0,255,65,0.15);
      --amber: #ffaa00;
      --red: #ff3300;
      --bg: #010c03;
      --bg2: #020f04;
      --mono: 'Share Tech Mono', monospace;
      --display: 'VT323', monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--green);
      font-family: var(--mono);
      overflow: hidden;
    }

    /* ── CRT Effects ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.12) 2px,
        rgba(0,0,0,0.12) 4px
      );
      pointer-events: none;
      z-index: 9998;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(0,0,0,0.75) 100%);
      pointer-events: none;
      z-index: 9997;
    }

    .scanline {
      position: fixed;
      left: 0; right: 0;
      height: 4px;
      background: linear-gradient(transparent, rgba(0,255,65,0.05), transparent);
      pointer-events: none;
      z-index: 9999;
      animation: scan 8s linear infinite;
    }

    @keyframes scan {
      0%   { top: -4px; }
      100% { top: 100vh; }
    }

    @keyframes flicker {
      0%, 95%, 100% { opacity: 1; }
      96% { opacity: 0.92; }
      97% { opacity: 1; }
      98% { opacity: 0.95; }
    }

    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0.15} }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulse { 0%,100%{box-shadow:0 0 8px var(--green-glow)} 50%{box-shadow:0 0 20px rgba(0,255,65,0.3)} }
    @keyframes completePulse {
      0%,100%{text-shadow:0 0 20px var(--amber),0 0 40px var(--amber)}
      50%{text-shadow:0 0 8px var(--amber)}
    }

    /* ── Layout ── */
    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: flicker 12s ease-in-out infinite;
    }

    .terminal {
      width: 100%;
      max-width: 460px;
      animation: fadeIn 0.6s ease-out;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 6px;
    }
    .header-top {
      font-size: 10px;
      letter-spacing: 5px;
      color: var(--green-dim);
      margin-bottom: 2px;
    }
    .header-title {
      font-family: var(--display);
      font-size: 28px;
      letter-spacing: 8px;
      color: var(--green);
      text-shadow: 0 0 15px var(--green);
      line-height: 1;
    }

    /* ── Screen ── */
    .screen {
      border: 1px solid var(--green-dim);
      border-radius: 3px;
      padding: 20px;
      background: rgba(0, 18, 6, 0.95);
      box-shadow:
        0 0 40px rgba(0,255,65,0.05),
        inset 0 0 80px rgba(0,0,0,0.6);
      position: relative;
    }
    .screen::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 3px;
      background: linear-gradient(180deg, rgba(0,255,65,0.02) 0%, transparent 30%);
      pointer-events: none;
    }

    /* ── Nav ── */
    .nav {
      display: flex;
      gap: 2px;
      margin-bottom: 16px;
    }
    .nav-btn {
      flex: 1;
      background: transparent;
      color: var(--green-dim);
      border: 1px solid var(--green-dim);
      padding: 6px;
      font-size: 9px;
      letter-spacing: 3px;
      cursor: pointer;
      font-family: var(--mono);
      text-transform: uppercase;
      transition: all 0.15s;
    }
    .nav-btn:hover { color: var(--green-mid); border-color: var(--green-mid); }
    .nav-btn.active {
      background: var(--green);
      color: var(--bg);
      border-color: var(--green);
      box-shadow: 0 0 10px var(--green-glow);
    }

    /* ── Category ── */
    .label {
      font-size: 9px;
      letter-spacing: 3px;
      color: var(--green-dim);
      margin-bottom: 6px;
      display: block;
    }
    .categories {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .cat-btn {
      background: transparent;
      color: var(--green-dim);
      border: 1px solid var(--green-dim);
      padding: 4px 9px;
      font-size: 9px;
      letter-spacing: 2px;
      cursor: pointer;
      font-family: var(--mono);
      transition: all 0.15s;
    }
    .cat-btn:hover { color: var(--green-mid); border-color: var(--green-mid); }
    .cat-btn.active {
      background: var(--green-dim);
      color: var(--green);
      border-color: var(--green-mid);
    }

    /* ── Clock ── */
    .clock-wrap {
      text-align: center;
      margin: 16px 0;
    }
    .progress-bar {
      height: 2px;
      background: var(--green-dim);
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
    }
    .progress-fill {
      position: absolute;
      left: 0; top: 0;
      height: 100%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      transition: width 1s linear;
    }
    .clock-display {
      font-family: var(--display);
      font-size: 96px;
      line-height: 1;
      letter-spacing: 6px;
      color: var(--green);
      text-shadow: 0 0 30px var(--green), 0 0 60px rgba(0,255,65,0.3);
      font-variant-numeric: tabular-nums;
      transition: color 0.3s, text-shadow 0.3s;
    }
    .clock-display.complete {
      color: var(--amber);
      text-shadow: 0 0 20px var(--amber), 0 0 40px rgba(255,170,0,0.4);
      animation: completePulse 1.2s ease-in-out infinite;
    }
    .clock-display.running {
      animation: pulse 3s ease-in-out infinite;
    }
    .colon { animation: blink 1s step-end infinite; display: inline-block; }
    .colon.paused { animation: none; opacity: 0.3; }

    .complete-msg {
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--amber);
      margin-top: 8px;
      height: 16px;
    }

    /* ── Presets ── */
    .presets {
      display: flex;
      gap: 4px;
      margin-bottom: 14px;
    }
    .preset-btn {
      flex: 1;
      background: transparent;
      color: var(--green-dim);
      border: 1px solid var(--green-dim);
      padding: 5px;
      font-size: 9px;
      letter-spacing: 2px;
      cursor: pointer;
      font-family: var(--mono);
      transition: all 0.15s;
    }
    .preset-btn:hover { color: var(--green-mid); border-color: var(--green-mid); }
    .preset-btn.active {
      color: var(--green-mid);
      border-color: var(--green-mid);
      background: rgba(0,100,20,0.2);
    }

    /* ── Controls ── */
    .controls { display: flex; gap: 6px; }
    .btn-primary {
      flex: 3;
      background: var(--green);
      color: var(--bg);
      border: 1px solid var(--green);
      padding: 13px;
      font-size: 13px;
      letter-spacing: 5px;
      cursor: pointer;
      font-family: var(--mono);
      font-weight: bold;
      box-shadow: 0 0 15px rgba(0,255,65,0.25);
      transition: all 0.15s;
    }
    .btn-primary.paused {
      background: transparent;
      color: var(--green);
      box-shadow: none;
    }
    .btn-primary:hover { box-shadow: 0 0 25px rgba(0,255,65,0.4); }
    .btn-secondary {
      flex: 1;
      background: transparent;
      color: var(--green-dim);
      border: 1px solid var(--green-dim);
      padding: 13px;
      font-size: 11px;
      cursor: pointer;
      font-family: var(--mono);
      transition: all 0.15s;
    }
    .btn-secondary:hover { color: var(--green-mid); border-color: var(--green-mid); }

    /* ── Status bar ── */
    .statusbar {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--green-dim);
      display: flex;
      justify-content: space-between;
      color: var(--green-dim);
      font-size: 9px;
      letter-spacing: 2px;
    }
    .status-dot {
      display: inline-block;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green-dim);
      margin-right: 4px;
      vertical-align: middle;
    }
    .status-dot.active {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 1.2s ease-in-out infinite;
    }

    /* ── Stats ── */
    .stats-header {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--green);
      margin-bottom: 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--green-dim);
    }
    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 18px;
    }
    .summary-card {
      border: 1px solid var(--green-dim);
      padding: 10px 6px;
      text-align: center;
    }
    .summary-card .s-label {
      font-size: 7px;
      letter-spacing: 2px;
      color: var(--green-dim);
      display: block;
      margin-bottom: 4px;
    }
    .summary-card .s-value {
      font-family: var(--display);
      font-size: 28px;
      color: var(--green);
      text-shadow: 0 0 10px rgba(0,255,65,0.4);
      line-height: 1;
    }
    .summary-card .s-sub {
      font-size: 7px;
      color: var(--green-dim);
      margin-top: 2px;
    }

    .section-label {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--green-dim);
      margin-bottom: 8px;
      display: block;
    }

    /* Bar chart */
    .bar-chart {
      display: flex;
      gap: 4px;
      align-items: flex-end;
      height: 70px;
      margin-bottom: 6px;
    }
    .bar-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 3px;
      height: 100%;
    }
    .bar-val {
      font-size: 7px;
      color: var(--green-dim);
      min-height: 10px;
    }
    .bar-fill {
      width: 100%;
      background: var(--green-dim);
      transition: height 0.4s ease;
    }
    .bar-fill.today {
      background: var(--green);
      box-shadow: 0 0 8px rgba(0,255,65,0.5);
    }
    .bar-day {
      font-size: 8px;
      letter-spacing: 1px;
      color: var(--green-dim);
    }
    .bar-day.today { color: var(--green); }

    /* Category bars */
    .cat-row { margin-bottom: 10px; }
    .cat-row-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
    }
    .cat-row-name { font-size: 9px; letter-spacing: 2px; color: var(--green-mid); }
    .cat-row-val { font-size: 9px; color: var(--green); }
    .cat-bar-bg { height: 3px; background: var(--green-dim); }
    .cat-bar-fill {
      height: 100%;
      background: var(--green);
      box-shadow: 0 0 4px var(--green);
      transition: width 0.5s ease;
    }

    /* Sessions list */
    .sessions-list {
      margin-top: 14px;
      max-height: 120px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--green-dim) transparent;
    }
    .session-row {
      display: flex;
      justify-content: space-between;
      font-size: 8px;
      color: var(--green-dim);
      padding: 3px 0;
      border-bottom: 1px solid rgba(0,77,20,0.3);
      letter-spacing: 1px;
    }

    /* Danger btn */
    .btn-danger {
      width: 100%;
      margin-top: 14px;
      background: transparent;
      color: var(--green-dim);
      border: 1px solid var(--green-dim);
      padding: 6px;
      font-size: 8px;
      letter-spacing: 3px;
      cursor: pointer;
      font-family: var(--mono);
      transition: all 0.15s;
    }
    .btn-danger:hover { color: var(--red); border-color: var(--red); }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 24px;
      color: var(--green-dim);
      font-size: 10px;
      letter-spacing: 2px;
      line-height: 2;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 6px;
      color: var(--green-dim);
      font-size: 8px;
      letter-spacing: 4px;
    }

    /* ── Install banner ── */
    #install-banner {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg2);
      border: 1px solid var(--green-mid);
      padding: 12px 16px;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--green);
      z-index: 10000;
      text-align: center;
      box-shadow: 0 0 20px var(--green-glow);
      animation: fadeIn 0.3s ease-out;
      max-width: 400px;
      width: calc(100% - 40px);
    }
    #install-banner button {
      display: inline-block;
      margin-top: 8px;
      background: var(--green);
      color: var(--bg);
      border: none;
      padding: 6px 14px;
      font-size: 9px;
      letter-spacing: 3px;
      cursor: pointer;
      font-family: var(--mono);
      margin-right: 8px;
    }
    #install-banner .dismiss {
      background: transparent;
      color: var(--green-dim);
      border: 1px solid var(--green-dim);
    }

    /* Notification toast */
    #toast {
      display: none;
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg2);
      border: 1px solid var(--amber);
      padding: 10px 20px;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--amber);
      z-index: 10001;
      animation: fadeIn 0.3s ease-out;
    }

    @media (max-width: 480px) {
      .clock-display { font-size: 76px; }
      .screen { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="scanline"></div>
  <div id="toast"></div>

  <div id="install-banner">
    ▼ INSTALLERA SOM APP
    <br>
    <button id="install-btn">◉ INSTALLERA</button>
    <button class="dismiss" id="dismiss-install">AVFÄRDA</button>
  </div>

  <div id="app">
    <div class="terminal">
      <div class="header">
        <div class="header-top">◄ DEEP WORK SYSTEM v1.0 ►</div>
        <div class="header-title">FOCUS</div>
      </div>

      <div class="screen">
        <!-- Nav -->
        <div class="nav">
          <button class="nav-btn active" id="nav-timer" onclick="showScreen('timer')">◉ TIMER</button>
          <button class="nav-btn" id="nav-stats" onclick="showScreen('stats')">◈ STATISTIK</button>
        </div>

        <!-- TIMER SCREEN -->
        <div id="screen-timer">
          <span class="label">KATEGORI:</span>
          <div class="categories" id="cat-buttons"></div>

          <div class="clock-wrap">
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill" style="width:0%"></div>
            </div>
            <div class="clock-display" id="clock-display">
              <span id="clock-mm">25</span><span class="colon paused" id="colon">:</span><span id="clock-ss">00</span>
            </div>
            <div class="complete-msg" id="complete-msg"></div>
          </div>

          <div class="presets" id="preset-buttons"></div>

          <div class="controls">
            <button class="btn-primary" id="btn-start" onclick="toggleTimer()">▶ START</button>
            <button class="btn-secondary" onclick="resetTimer()">↺</button>
          </div>

          <div class="statusbar">
            <span><span class="status-dot" id="status-dot"></span><span id="status-text">STANDBY</span></span>
            <span id="stat-today">IDAG: 0 MIN</span>
            <span id="stat-week">VECKA: 0 MIN</span>
          </div>
        </div>

        <!-- STATS SCREEN -->
        <div id="screen-stats" style="display:none">
          <div class="stats-header" id="stats-header"></div>

          <div class="summary-grid" id="summary-grid"></div>

          <span class="section-label">DAGLIG AKTIVITET:</span>
          <div class="bar-chart" id="bar-chart"></div>

          <div id="cat-stats"></div>

          <div id="recent-sessions"></div>

          <button class="btn-danger" onclick="clearData()">⊘ RENSA ALL DATA</button>
        </div>
      </div>

      <div class="footer">── "GÅ DJUPT. INTE FORT." ──</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
